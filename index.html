<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Asistente de riesgo DMCS</title>
<style>
:root {
  --bg: #f4f6f9; --surface: #ffffff; --text: #18202b; --muted: #566274; --border: #d9dee6;
  --primary: #1d5fc4; --on-primary: #ffffff; --user-bg: #1d5fc4; --user-text: #ffffff;
  --bajo-bg: #dff3e7; --bajo-tx: #0f5a33; --medio-bg: #fff0cc; --medio-tx: #6b4300;
  --alto-bg: #fde0de; --alto-tx: #8f1d16; --warn-bg: #fff7e0; --warn-tx: #5f4300;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #18202a; --text: #e8edf3; --muted: #9fabb9; --border: #2a3441;
    --primary: #7aaeff; --on-primary: #071426; --user-bg: #2b5bb0; --user-text: #ffffff;
    --bajo-bg: #16372a; --bajo-tx: #8fe0b3; --medio-bg: #3d3114; --medio-tx: #f3cf7a;
    --alto-bg: #44201e; --alto-tx: #ffb3ad; --warn-bg: #33291a; --warn-tx: #f1d38b;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #18202a; --text: #e8edf3; --muted: #9fabb9; --border: #2a3441;
  --primary: #7aaeff; --on-primary: #071426; --user-bg: #2b5bb0; --user-text: #ffffff;
  --bajo-bg: #16372a; --bajo-tx: #8fe0b3; --medio-bg: #3d3114; --medio-tx: #f3cf7a;
  --alto-bg: #44201e; --alto-tx: #ffb3ad; --warn-bg: #33291a; --warn-tx: #f1d38b;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
[hidden] { display: none !important; }
.app { display: flex; flex-direction: column; height: 100%; max-width: 760px; margin: 0 auto; background: var(--bg); }
header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .6rem .9rem;
  background: var(--surface); border-bottom: 1px solid var(--border); }
header h1 { margin: 0; font-size: 1.02rem; line-height: 1.2; }
header small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
.acciones { display: flex; gap: .4rem; flex-shrink: 0; }
.btn { min-height: 40px; padding: .35rem .7rem; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font: inherit; font-size: .85rem; cursor: pointer; }
.btn:hover { border-color: var(--primary); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
#chat { flex: 1; overflow-y: auto; padding: .8rem; display: flex; flex-direction: column; gap: .55rem; }
.msg { max-width: 90%; padding: .6rem .8rem; border-radius: 14px; white-space: pre-line; overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); border-top-right-radius: 4px; }
.msg.bot:has(.tarjeta) { max-width: 100%; width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; align-self: flex-start; max-width: 100%; }
.chips.vertical { flex-direction: column; align-items: stretch; width: min(100%, 420px); }
.chip { min-height: 44px; padding: .45rem .95rem; border-radius: 22px; border: 1px solid var(--primary);
  background: var(--surface); color: var(--primary); font: inherit; font-size: .92rem; cursor: pointer; text-align: left; }
.chip:hover { background: var(--primary); color: var(--on-primary); }
.barra { display: flex; gap: .5rem; padding: .6rem .8rem; background: var(--surface); border-top: 1px solid var(--border); }
.barra input { flex: 1; min-width: 0; min-height: 44px; padding: .5rem .8rem; border-radius: 22px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font: inherit; }
.barra button { min-height: 44px; padding: 0 1.1rem; border-radius: 22px; border: 0; background: var(--primary);
  color: var(--on-primary); font: inherit; font-weight: 600; cursor: pointer; }
.tarjeta { white-space: normal; }
.tarjeta h4 { margin: .8rem 0 .25rem; font-size: .95rem; }
.tarjeta ul, .tarjeta ol { margin: .2rem 0; padding-left: 1.2rem; }
.tarjeta li { margin: .15rem 0; }
.tarjeta p { margin: .35rem 0; }
.nivel { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap;
  padding: .55rem .75rem; border-radius: 10px; margin-top: .3rem; }
.nivel strong { font-size: 1.05rem; }
.nivel .conf { font-size: .82rem; }
.nivel-bajo { background: var(--bajo-bg); color: var(--bajo-tx); }
.nivel-medio { background: var(--medio-bg); color: var(--medio-tx); }
.nivel-alto { background: var(--alto-bg); color: var(--alto-tx); }
.ctx { color: var(--muted); font-size: .9rem; }
.aviso { background: var(--warn-bg); color: var(--warn-tx); padding: .45rem .65rem; border-radius: 8px; font-size: .9rem; }
.advertencia { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: .5rem; margin-top: .7rem !important; }
details { margin-top: .6rem; }
summary { cursor: pointer; min-height: 32px; color: var(--primary); }
#ficha { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + .9rem) .9rem calc(env(safe-area-inset-bottom, 0px) + .9rem); }
#ficha .interior { max-width: 760px; margin: 0 auto; }
#ficha h2 { margin: 0; font-size: 1.15rem; }
#ficha h3 { margin: 1.1rem 0 .3rem; font-size: 1rem; }
#ficha .cab { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
#ficha p, #ficha li { font-size: .93rem; }
.tabla { overflow-x: auto; margin: .4rem 0; }
table { border-collapse: collapse; width: 100%; font-size: .84rem; }
th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
noscript { display: block; padding: 1rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Asistente de riesgo DMCS<small>Estimación informativa · casos policiales 2025</small></h1>
    <div class="acciones">
      <button class="btn" id="abrir-ficha" type="button">Ficha técnica</button>
      <button class="btn" id="reiniciar" type="button">Reiniciar</button>
    </div>
  </header>
  <main id="chat" aria-live="polite" aria-label="Conversación"></main>
  <div class="barra">
    <input id="entrada" type="text" autocomplete="off" enterkeyhint="send" aria-label="Escribe tu mensaje" placeholder="Escribe aquí…">
    <button id="enviar" type="button">Enviar</button>
  </div>
  <noscript>Esta página necesita JavaScript para funcionar.</noscript>
</div>
<div id="ficha" role="dialog" aria-modal="true" aria-label="Ficha técnica" hidden>
  <div class="interior">
    <div class="cab"><h2>Ficha técnica</h2><button class="btn" id="cerrar-ficha" type="button">Cerrar</button></div>
    <div id="ficha-cuerpo"></div>
  </div>
</div>

<script>
const D = JSON.parse(document.getElementById("datos").textContent);
/* ===== Motor del chatbot: estimador de riesgo y validadores ===== */
/* Requiere la variable global D (contenido de estimador_dmcs_v1.json). */

const NIVELES = ["bajo", "medio", "alto"];
const DIMS = ["region", "dia", "franja", "mes"];
const LIM_INF = Date.UTC(2025, 0, 1);
const LIM_SUP = Date.UTC(2027, 11, 31);

/* ---------- Estimador (replica la clase EstimadorRiesgo del notebook) ---------- */
function erf(x) {
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
}
function cdf(x) { return 0.5 * (1 + erf(x / Math.SQRT2)); }

function percentil(arr, p) {
  const a = Float64Array.from(arr).sort();
  const pos = (a.length - 1) * p / 100, lo = Math.floor(pos), hi = Math.ceil(pos);
  return a[lo] + (a[hi] - a[lo]) * (pos - lo);
}

const POB_TOTAL = Object.values(D.poblacion).reduce((a, b) => a + b, 0);
const BASE = {};
D.grupos.forEach(k => { BASE[k] = D.N[k] * 1e5 / (POB_TOTAL * 365 * 6); });

function vec(k, dim, cats) { return cats.map(c => D.shares[k][dim][c] / D.expo[dim][c]); }
function catsDe(dim) { return { region: D.regiones, dia: D.dias, franja: D.franjas, mes: D.meses }[dim]; }

const CORTES = {}, MEDIA = {};
(function () {
  const todos = new Float64Array(16 * 7 * 6 * 12);
  D.grupos.forEach(k => {
    const r = vec(k, "region", D.regiones), d = vec(k, "dia", D.dias), h = vec(k, "franja", D.franjas), m = vec(k, "mes", D.meses);
    const g = new Float64Array(todos.length);
    let n = 0;
    for (let i = 0; i < r.length; i++) for (let j = 0; j < d.length; j++) for (let a = 0; a < h.length; a++) for (let b = 0; b < m.length; b++) {
      g[n] = BASE[k] * r[i] * d[j] * h[a] * m[b]; todos[n] += g[n]; n++;
    }
    CORTES[k] = [percentil(g, 50), percentil(g, 85)];
    MEDIA[k] = g.reduce((x, y) => x + y, 0) / g.length;
  });
  CORTES.Todos = [percentil(todos, 50), percentil(todos, 85)];
  MEDIA.Todos = todos.reduce((x, y) => x + y, 0) / todos.length;
})();

function consultar(region, dia, franja, mes, grupo) {
  let insuficiente = false;
  if (grupo && D.N[grupo] * D.shares[grupo].region[region] < D.min_casos) { grupo = null; insuficiente = true; }
  const ks = grupo ? [grupo] : D.grupos;
  const sel = { region, dia, franja, mes };
  const idx = {}, tasaK = {};
  ks.forEach(k => {
    idx[k] = {};
    DIMS.forEach(d => { idx[k][d] = D.shares[k][d][sel[d]] / D.expo[d][sel[d]]; });
    tasaK[k] = BASE[k] * DIMS.reduce((p, d) => p * idx[k][d], 1);
  });
  const tasa = ks.reduce((s, k) => s + tasaK[k], 0);
  const tot = ks.reduce((s, k) => s + D.N[k], 0);
  let sig2 = 0;
  DIMS.forEach(d => { const v = ks.reduce((s, k) => s + D.N[k] * D.sigma[k][d], 0) / tot; sig2 += v * v; });
  const sig = Math.sqrt(sig2);
  const [c1, c2] = CORTES[grupo || "Todos"];
  const mu = Math.log(tasa);
  const pBajo = cdf((Math.log(c1) - mu) / sig), pAlto = 1 - cdf((Math.log(c2) - mu) / sig);
  const probs = [pBajo, 1 - pBajo - pAlto, pAlto];
  const nivel = tasa < c1 ? 0 : (tasa < c2 ? 1 : 2);
  const factores = {};
  DIMS.forEach(d => { factores[d] = ks.reduce((s, k) => s + D.N[k] * idx[k][d], 0) / tot; });
  const probables = grupo ? [] : ks.map(k => [k, tasaK[k] / tasa]).sort((a, b) => b[1] - a[1]).slice(0, 3);
  return { nivel, probs, confianza: probs[nivel], intensidad: tasa / MEDIA[grupo || "Todos"], factores, probables, insuficiente, sigma: sig, grupoUsado: grupo };
}

/* ---------- Texto, lugares y fechas ---------- */
function norm(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/['’`´]/g, "").replace(/\s+/g, " ").trim();
}
function bonito(s) { return String(s).replace(/'/g, "’"); }

function similitud(a, b) {
  const m = a.length, n = b.length;
  if (!m || !n) return 0;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return 1 - prev[n] / Math.max(m, n);
}

const COMUNAS_RM = ["Santiago", "Cerrillos", "Cerro Navia", "Conchalí", "El Bosque", "Estación Central", "Huechuraba", "Independencia",

  "valpo": "Valparaíso", "bio bio": "Biobío", "araucania": "La Araucanía", "o higgins": "O'Higgins", "libertador bernardo ohiggins": "O'Higgins",
  "arica": "Arica y Parinacota", "parinacota": "Arica y Parinacota", "punta arenas": "Magallanes", "magallanes y antartica": "Magallanes",
  "aysen del general carlos ibanez": "Aysén", "iquique": "Tarapacá" };

const LUGARES = [];
D.regiones.forEach(r => LUGARES.push({ key: norm(r), display: r, region: r, comuna: false }));
Object.keys(ALIAS_REGION).forEach(a => LUGARES.push({ key: a, display: ALIAS_REGION[a], region: ALIAS_REGION[a], comuna: false }));
COMUNAS_RM.forEach(c => LUGARES.push({ key: norm(c), display: c, region: "Metropolitana", comuna: true }));

function resolverLugar(texto) {
  let t = norm(texto).replace(/^(la )?region (del |de la |de )?/, "");
  const exacto = LUGARES.find(l => l.key === t);
  if (exacto) return { tipo: "ok", lugar: exacto };
  const puntajes = new Map();
  LUGARES.forEach(l => {
    let s = similitud(t, l.key);
    if (t.length >= 3 && l.key.includes(t)) s = Math.max(s, 0.8);
    if (l.key.length >= 4 && t.includes(l.key)) s = Math.max(s, 0.8);
    const ant = puntajes.get(l.display);
    if (!ant || ant.s < s) puntajes.set(l.display, { s, l });
  });
  const lista = [...puntajes.values()].filter(x => x.s >= 0.55).sort((a, b) => b.s - a.s).slice(0, 3).map(x => x.l);
  return lista.length ? { tipo: "sug", lista } : { tipo: "no", lista: [] };
}

const RE_FUERA = /\b(calle|avenida|pasaje|direccion|domicilio|casa de|rut|vecino|vecina|persona|sospechoso|sospechosa|delincuente|quien)\b/;
function fueraDeAlcance(texto) { return RE_FUERA.test(norm(texto)); }

function ahoraChile() {
  const p = {};
  new Intl.DateTimeFormat("en-CA", { timeZone: "America/Santiago", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return { y: +p.year, m: +p.month, d: +p.day, hh: +p.hour, mm: +p.minute };
}

function validarFecha(y, m, d, hh, mm) {
  if (m < 1 || m > 12 || d < 1 || d > 31) return { ok: false, motivo: "fecha" };
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return { ok: false, motivo: "fecha" };
  if (hh < 0 || hh > 23 || mm < 0 || mm > 59) return { ok: false, motivo: "hora" };
  if (dt.getTime() < LIM_INF || dt.getTime() > LIM_SUP) return { ok: false, motivo: "rango" };
  return { ok: true, y, m, d, hh, mm };
}

function parsearFecha(texto, ahora) {
  const t = norm(texto);
  if (/^(ahora|ya|en este momento)$/.test(t)) return validarFecha(ahora.y, ahora.m, ahora.d, ahora.hh, ahora.mm);
  let y = ahora.y, m = ahora.m, d = ahora.d;
  const f = t.match(/(\d{1,2})[-\/.](\d{1,2})(?:[-\/.](\d{2,4}))?/);
  if (f) {
    d = +f[1]; m = +f[2];
    if (f[3]) y = f[3].length === 2 ? 2000 + +f[3] : +f[3];
  } else if (/pasado manana/.test(t) || /\bmanana\b/.test(t) || /\bhoy\b/.test(t)) {
    const add = /pasado manana/.test(t) ? 2 : (/\bmanana\b/.test(t) ? 1 : 0);
    const dt = new Date(Date.UTC(ahora.y, ahora.m - 1, ahora.d + add));
    y = dt.getUTCFullYear(); m = dt.getUTCMonth() + 1; d = dt.getUTCDate();
  }
  const h = t.match(/(\d{1,2}):(\d{2})/) || t.match(/\b(\d{1,2})\s*(?:h|hrs|horas)\b/);
  if (!h) return { ok: false, motivo: "hora" };
  const hh = +h[1], mm = h[2] !== undefined ? +h[2] : 0;
  return validarFecha(y, m, d, hh, mm);
}

function franjaDesde(hh, mm) {
  const mins = hh * 60 + mm;
  return mins === 0 ? 0 : Math.ceil(mins / 240) - 1;
}
function diaDesde(y, m, d) { return D.dias[(new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7]; }
function epocaDe(m) { return m === 12 || m <= 2 ? "verano" : (m <= 5 ? "otoño" : (m <= 8 ? "invierno" : "primavera")); }
function feriadoDe(y, m, d) { return D.feriados[`${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`] || null; }

if (typeof module !== "undefined") {
  module.exports = { consultar, parsearFecha, resolverLugar, franjaDesde, diaDesde, epocaDe, feriadoDe, fueraDeAlcance, CORTES, norm, NIVELES };
}

/* ===== Interfaz del chatbot (flujo de 11 pasos, bifurcaciones A, B y C) ===== */
(function () {
  const chat = document.getElementById("chat");
  const entrada = document.getElementById("entrada");
  const btnEnviar = document.getElementById("enviar");
  const ficha = document.getElementById("ficha");
  const MAX_INTENTOS = 3, LIMITE_MSG = 20, VENTANA_MS = 60000, RETENCION_DIAS = 30;
  const LS_FB = "dmcs_feedback_v1", LS_INC = "dmcs_incidentes_v1";
  const fmt = (x, n = 1) => x.toFixed(n).replace(".", ",");
  const dd = n => String(n).padStart(2, "0");

  /* ---------- Registros sin datos personales (con plazo de eliminación) ---------- */
  const memoria = {};
  function leerLS(k) { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch (e) { return memoria[k] || []; } }
  function escribirLS(k, v) { memoria[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
  function purgar() {
    const lim = Date.now() - RETENCION_DIAS * 864e5;
    [LS_FB, LS_INC].forEach(k => escribirLS(k, leerLS(k).filter(x => x.t >= lim)));
  }
  function registrar(k, obj) { const a = leerLS(k); a.push(Object.assign({ t: Date.now() }, obj)); escribirLS(k, a); }

  function el(tag, cls, texto) {

      c.appendChild(b);
    });
    chat.appendChild(c); bajar();

  function bot(texto, botones, vertical) {

  /* ---------- Pasos del flujo ---------- */
  function iniciar() {                                          // pasos 1 y 2
    S = nuevaSesion(); S.estado = "aviso";
    chat.textContent = "";
    mensaje("bot", "¡Hola! Soy el asistente de riesgo de delitos de mayor connotación social (DMCS). Puedo estimar si el riesgo es bajo, medio o alto según la región, el día, la franja horaria y la época del año, y contarte qué tipos de delito son más probables.");
    bot("Antes de empezar, ten en cuenta:\n• Es una estimación a partir de casos policiales de 2025 (Carabineros, vía INE), no una certeza.\n• No identifica ni evalúa personas, ni direcciones exactas.\n• Es un apoyo informativo y preventivo: no sirve para decisiones sobre personas ni para sanciones.\n• No pedimos datos personales. Solo se guarda en tu navegador, por " + RETENCION_DIAS + " días, si el resultado te fue útil, y puedes borrarlo en la ficha técnica.\n\n¿Aceptas continuar?",
      [{ label: "Acepto", id: "acepto" }, { label: "No acepto", id: "no_acepto" }]);
  }

  function pedirLugar(modo) {                                    // paso 3
    S.estado = modo === 2 ? "lugar2" : "lugar"; S.intentos = 0;
    bot(modo === 2 ? "¿Con qué comuna o región quieres comparar?" :
      "¿Para cual Región te gustaría hacer la consulta? Puedes consultar otras regiones de Chile. Escribe el nombre (por ejemplo, Maule, Biobío o Aysén) o elige una opción.",
      [{ label: "Región Metropolitana", id: "reg:" + D.regiones.indexOf("Metropolitana") }, { label: "Ver todas las regiones", id: "ver_reg" }]);
  }

  function fijarLugar(lugar, modo) {
    if (modo === 2) { S.lugar2 = lugar; S.ultimoCmp = true; return comparar(); }
    S.lugar = lugar.region; S.comuna = lugar.comuna ? lugar.display : null;
    if (lugar.comuna) mensaje("bot", `Anoto ${bonito(lugar.display)}. Por ahora mis datos llegan solo hasta el nivel de región, así que la estimación será para toda la Región Metropolitana.`);
    pedirFecha();
  }

  function manejarLugar(tipo, valor, modo) {                    // pasos B / 4
    if (tipo === "boton") {
      if (valor === "ver_reg") return bot("Elige una región:", CH_REGIONES());
      const [k, i] = valor.split(":");
      if (k === "reg") return fijarLugar({ region: D.regiones[+i], display: D.regiones[+i], comuna: false }, modo);
      if (k === "sug") return fijarLugar(S.sugs[+i], modo);
      return;
    }
    if (fueraDeAlcance(valor)) return rechazarAlcance();
    const r = resolverLugar(valor);
    if (r.tipo === "ok") return fijarLugar(r.lugar, modo);
    S.intentos++;
    if (S.intentos >= MAX_INTENTOS) {
      return bot("No logré reconocer el lugar después de 3 intentos. Elige una región en los botones:", CH_REGIONES());
    }
    S.sugs = r.lista;
    if (r.lista.length) {
      bot(`No encontré “${valor.trim().slice(0, 40)}”. ¿Quisiste decir alguna de estas? (intento ${S.intentos} de ${MAX_INTENTOS})`,
        r.lista.map((l, i) => ({ label: bonito(l.display), id: "sug:" + i })).concat([{ label: "Ver todas las regiones", id: "ver_reg" }]));
    } else {
      bot(`No encontré “${valor.trim().slice(0, 40)}”. Revisa la ortografía o elige en los botones. (intento ${S.intentos} de ${MAX_INTENTOS})`,
        [{ label: "Ver todas las regiones", id: "ver_reg" }]);
    }
  }

  function pedirFecha() {                                        // paso 5
    S.estado = "fecha"; S.intentos = 0;
    bot("¿Para qué día y hora quieres la estimación? Escribe, por ejemplo, 25-12-2026 22:30, “hoy 20:00” o “mañana 08:30”. También puedes usar los botones.",
      [{ label: "Ahora", id: "ahora" }, { label: "Elegir día y franja", id: "elegir" }]);
  }

  function fijarFecha(f) {                                       // paso 6: validación y variables derivadas
    S.fecha = f; S.dia = diaDesde(f.y, f.m, f.d); S.franja = D.franjas[franjaDesde(f.hh, f.mm)]; S.mes = D.meses[f.m - 1];
    const fer = feriadoDe(f.y, f.m, f.d);
    mensaje("bot", `Listo: ${S.dia} ${dd(f.d)}-${dd(f.m)}-${f.y}, franja ${S.franja}.\nÉpoca del año: ${epocaDe(f.m)}. ${fer ? "Feriado: " + fer + "." : "No es feriado."}`);
    pedirDelito();
  }

  function pedirDelito() {                                       // paso 5 (opcional)
    S.estado = "delito";
    bot("¿Quieres filtrar por un tipo de delito? Es opcional.",
      [{ label: "Todos los DMCS", id: "del:todos" }].concat(D.grupos.map((g, i) => ({ label: g, id: "del:" + i }))), true);
  }

  function manejarFecha(tipo, valor) {
    if (tipo === "boton") {
      if (valor === "ahora") return aplicarFecha(parsearFecha("ahora", ahoraChile()));
      if (valor === "elegir") return pedirDiaBoton();
      return;
    }
    if (fueraDeAlcance(valor)) return rechazarAlcance();
    aplicarFecha(parsearFecha(valor, ahoraChile()));
  }
  function aplicarFecha(r) {
    if (r.ok) return fijarFecha(r);
    S.intentos++;
    const msg = { hora: "Me falta una hora válida. Prueba con el formato 25-12-2026 22:30.",
                  fecha: "Esa fecha no es válida. Prueba con el formato 25-12-2026 22:30.",
                  rango: "Esa fecha está fuera del rango que tengo disponible: puedo estimar entre el 01-01-2025 y el 31-12-2027." }[r.motivo];
    if (S.intentos >= MAX_INTENTOS) { mensaje("bot", msg); return pedirDiaBoton(); }
    bot(`${msg} (intento ${S.intentos} de ${MAX_INTENTOS})`, [{ label: "Ahora", id: "ahora" }, { label: "Elegir día y franja", id: "elegir" }]);
  }
  function pedirDiaBoton() {
    S.estado = "dia_btn";
    bot("Elijamos con botones. ¿Qué día de la semana?", D.dias.map((d, i) => ({ label: d, id: "dia:" + i })));
  }

  function manejarDiaBoton(tipo, valor) {
    if (tipo !== "boton") return bot("Usa los botones para elegir el día.");
    const [k, i] = valor.split(":");
    if (k === "dia") {
      S.dia = D.dias[+i]; S.estado = "franja_btn";
      return bot("¿En qué franja horaria?", D.franjas.map((f, j) => ({ label: f, id: "fr:" + j })));
    }
    if (k === "fr") {
      S.franja = D.franjas[+i]; S.fecha = null; S.mes = D.meses[ahoraChile().m - 1];
      mensaje("bot", `Listo: ${S.dia}, franja ${S.franja}. Como no indicaste fecha, uso el mes actual (${S.mes.toLowerCase()}).`);
      return pedirDelito();
    }
  }

  function manejarDelito(tipo, valor) {
    let grupo = undefined;
    if (tipo === "boton") {
      const [, i] = valor.split(":");
      grupo = i === "todos" ? null : D.grupos[+i];
    } else {
      if (fueraDeAlcance(valor)) return rechazarAlcance();
      const t = norm(valor);
      if (/^(todos|todo|ninguno|no|cualquiera)/.test(t)) grupo = null;
      else { const g = D.grupos.find(x => norm(x).includes(t) && t.length >= 4); if (g) grupo = g; }
    }
    if (grupo === undefined) return bot("No reconocí ese tipo de delito. Elige una opción de la lista:", [{ label: "Todos los DMCS", id: "del:todos" }].concat(D.grupos.map((g, i) => ({ label: g, id: "del:" + i }))), true);
    S.grupo = grupo;
    calcular(false);
  }

  /* ---------- Pasos 7 a 10: modelo y resultado ---------- */
  function consultarConReintento(lugar) {
    let ultimoError;
    for (let intento = 1; intento <= 2; intento++) {
      try { return consultar(lugar, S.dia, S.franja, S.mes, S.grupo); }
      catch (e) { ultimoError = e; registrar(LS_INC, { error: String(e && e.message || e).slice(0, 120), intento }); }
    }
    throw ultimoError;
  }

  function calcular() {
    let r;
    try { r = consultarConReintento(S.lugar); }
    catch (e) {
      S.estado = "resultado";
      return bot("⚠️ Tuve una falla temporal al calcular la estimación. Ya lo dejé registrado. ¿Quieres reintentar?",
        [{ label: "Reintentar", id: "reintentar" }, { label: "Nueva consulta", id: "nueva" }]);
    }
    S.ultimo = r; S.ultimoCmp = false; S.estado = "resultado";
    mensaje("bot", tarjetaResultado(r));
    chips(botonesFinales());
  }

  function botonesFinales() {
    return [{ label: "Nueva consulta", id: "nueva" }, { label: "Comparar con otra región", id: "comparar" },
            { label: "👍 Me fue útil", id: "fb_si" }, { label: "👎 No me fue útil", id: "fb_no" }, { label: "Terminar", id: "fin" }];
  }

  const ICONO = ["🟢", "🟡", "🔴"];
  function rangoTexto(r) {                                       // rango contiguo al nivel estimado
    let lo = r.nivel, hi = r.nivel;
    if (r.nivel === 0) hi = 1;
    else if (r.nivel === 2) lo = 1;
    else if (r.probs[2] >= r.probs[0]) hi = 2; else lo = 0;
    return `entre ${NIVELES[lo]} y ${NIVELES[hi]}`;
  }
  function contexto() {
    const partes = [bonito(S.lugar), S.fecha ? `${S.dia} ${dd(S.fecha.d)}-${dd(S.fecha.m)}-${S.fecha.y}` : S.dia, S.franja];
    if (S.fecha) { partes.push(epocaDe(S.fecha.m)); const f = feriadoDe(S.fecha.y, S.fecha.m, S.fecha.d); if (f) partes.push("feriado: " + f); }
    else partes.push(S.mes.toLowerCase());
    return partes.join(" · ");
  }
  function descFactor(v) { return v >= 1.15 ? "sobre el promedio" : (v <= 0.85 ? "bajo el promedio" : "cerca del promedio"); }
  const ETIQ = { region: "Región (tasa por habitante)", dia: "Día de la semana", franja: "Franja horaria", mes: "Mes del año" };

  function tarjetaResultado(r) {
    const alta = r.confianza >= D.umbral;
    const caja = el("div", "tarjeta");
    const cab = el("div", "nivel nivel-" + NIVELES[r.nivel]);
    cab.appendChild(el("strong", "", alta ? `${ICONO[r.nivel]} Riesgo ${NIVELES[r.nivel].toUpperCase()}` : `${ICONO[r.nivel]} Riesgo ${rangoTexto(r)}`));
    cab.appendChild(el("span", "conf", alta ? "Confianza alta" : "Confianza baja"));
    caja.appendChild(cab);
    caja.appendChild(el("p", "ctx", contexto()));
    if (S.comuna) caja.appendChild(el("p", "aviso", `Consulta: ${bonito(S.comuna)}. La estimación es a nivel de Región Metropolitana.`));
    if (!alta) caja.appendChild(el("p", "aviso", "⚠️ La confianza es menor al umbral, por eso te muestro un rango y no un único nivel. Tómalo con más cautela."));
    if (r.insuficiente) caja.appendChild(el("p", "aviso", `⚠️ Hay pocos casos de “${S.grupo}” en esta región. Te muestro el resultado agregado de todos los DMCS.`));
    if (S.fecha && S.fecha.y > 2025) caja.appendChild(el("p", "aviso", "La fecha es posterior a 2025: uso los patrones de 2025, el último año disponible."));

    if (r.probables.length) {
      caja.appendChild(el("h4", "", "Tipos de delito más probables"));
      const ol = el("ol");
      r.probables.forEach(([g, p]) => ol.appendChild(el("li", "", `${g} (aprox. ${Math.round(p * 20) * 5}%)`)));
      caja.appendChild(ol);
    } else {
      caja.appendChild(el("h4", "", "Delito consultado"));
      caja.appendChild(el("p", "", r.insuficiente ? "Todos los DMCS" : S.grupo));
    }
    caja.appendChild(el("h4", "", "Factores que explican el resultado"));
    const ul = el("ul");
    ["region", "franja", "dia", "mes"].forEach(d => {
      ul.appendChild(el("li", "", `${ETIQ[d]}: ${fmt(r.factores[d])}× el promedio, ${descFactor(r.factores[d])}`));
    });
    caja.appendChild(ul);

    const det = el("details");
    det.appendChild(el("summary", "", "Ver detalle técnico"));
    const pr = r.probs.map(p => Math.round(Math.max(0, p) * 20) * 5);
    det.appendChild(el("p", "ctx", `Probabilidad aproximada: bajo ${pr[0]}%, medio ${pr[1]}%, alto ${pr[2]}%. Intensidad estimada: ${fmt(r.intensidad)}× la de una combinación típica. Umbral de confianza: ${fmt(D.umbral, 2)}. Modelo: ${D.modelo}.`));
    caja.appendChild(det);
    caja.appendChild(el("p", "advertencia", "Esta es una estimación basada en casos policiales de 2025, no una certeza. No identifica ni evalúa personas ni lugares exactos, y no debe usarse para decisiones sobre personas ni para sanciones."));
    return caja;
  }

  function comparar() {
    let a, b;
    try { a = consultarConReintento(S.lugar); b = consultarConReintento(S.lugar2.region); }
    catch (e) { S.estado = "resultado"; return bot("⚠️ Tuve una falla temporal al comparar. Ya lo dejé registrado.", [{ label: "Reintentar", id: "reintentar" }, { label: "Nueva consulta", id: "nueva" }]); }
    S.estado = "resultado";
    const caja = el("div", "tarjeta");
    caja.appendChild(el("h4", "", "Comparación"));
    caja.appendChild(el("p", "ctx", `${S.dia} · ${S.franja} · ${S.fecha ? dd(S.fecha.d) + "-" + dd(S.fecha.m) + "-" + S.fecha.y : S.mes.toLowerCase()}`));
    [[S.lugar, a], [S.lugar2.region, b]].forEach(([lug, r]) => {
      const alta = r.confianza >= D.umbral;
      const fila = el("div", "nivel nivel-" + NIVELES[r.nivel]);
      fila.appendChild(el("strong", "", `${bonito(lug)}: ${ICONO[r.nivel]} ${alta ? NIVELES[r.nivel] : rangoTexto(r)}`));
      fila.appendChild(el("span", "conf", alta ? "Confianza alta" : "Confianza baja"));
      caja.appendChild(fila);
      caja.appendChild(el("p", "ctx", `Tasa por habitante: ${fmt(r.factores.region)}× el promedio nacional.`));
    });
    caja.appendChild(el("p", "advertencia", "Esto no es un ranking de peligrosidad. Los registros reflejan dónde se denuncia y se patrulla, no solo dónde hay más delito, y las diferencias entre regiones deben leerse con cautela."));
    mensaje("bot", caja);
    chips(botonesFinales());
  }

  /* ---------- Paso 11 y excepciones ---------- */
  function rechazarAlcance() {
    bot("No puedo responder consultas sobre personas ni direcciones exactas. Este asistente trabaja solo con datos agregados por región, día, franja horaria y época del año, para proteger la privacidad y evitar estigmatizar a personas o lugares. Puedes reformular tu consulta con una comuna o región.");
  }

  function manejarResultado(tipo, valor) {
    if (tipo !== "boton") return bot("Usa los botones para seguir, o escribe “nueva consulta”.", botonesFinales());
    if (valor === "nueva") return pedirLugar();
    if (valor === "comparar") { S.estado = "lugar2"; return pedirLugar(2); }
    if (valor === "reintentar") return S.ultimoCmp ? comparar() : calcular();
    if (valor === "fb_si" || valor === "fb_no") {
      registrar(LS_FB, { util: valor === "fb_si", nivel: S.ultimo ? NIVELES[S.ultimo.nivel] : null });
      return bot("¡Gracias por tu opinión! Me ayuda a mejorar.", [{ label: "Nueva consulta", id: "nueva" }, { label: "Terminar", id: "fin" }]);
    }
    if (valor === "fin") {
      S.estado = "fin";
      return bot("Gracias por usar el asistente. Recuerda que es una estimación informativa y preventiva. Cerré la sesión; no guardé datos personales.", [{ label: "Empezar de nuevo", id: "reiniciar" }]);
    }
  }

  /* ---------- Despacho ---------- */
  function procesar(tipo, valor) {
    const ahora = Date.now();
    S.marcas = S.marcas.filter(t => ahora - t < VENTANA_MS); S.marcas.push(ahora);
    if (S.marcas.length > LIMITE_MSG) return bot("Estás enviando muchas solicitudes seguidas. Espera un momento e inténtalo de nuevo.");
    if (tipo === "boton" && valor === "reiniciar") return iniciar();
    try {
      switch (S.estado) {
        case "aviso":
          if (tipo === "boton" && valor === "acepto") { S.acepto = true; return pedirLugar(); }
          if (tipo === "boton" && valor === "no_acepto") {                    // bifurcación A
            S.estado = "fin";
            return bot("Entiendo. Sin aceptar el aviso de privacidad y de uso no puedo continuar, así que termino la sesión aquí. Si cambias de opinión, puedes empezar de nuevo.", [{ label: "Empezar de nuevo", id: "reiniciar" }]);
          }
          return bot("Para continuar necesito que aceptes el aviso. ¿Aceptas?", [{ label: "Acepto", id: "acepto" }, { label: "No acepto", id: "no_acepto" }]);
        case "lugar": return manejarLugar(tipo, valor, 1);
        case "lugar2": return manejarLugar(tipo, valor, 2);
        case "fecha": return manejarFecha(tipo, valor);
        case "dia_btn": case "franja_btn": return manejarDiaBoton(tipo, valor);
        case "delito": return manejarDelito(tipo, valor);
        case "resultado":
          if (tipo === "texto" && /^nueva/.test(norm(valor))) return pedirLugar();
          return manejarResultado(tipo, valor);
        default:
          return bot("La sesión terminó. ¿Quieres empezar de nuevo?", [{ label: "Empezar de nuevo", id: "reiniciar" }]);
      }
    } catch (e) {
      registrar(LS_INC, { error: String(e && e.message || e).slice(0, 120), paso: S.estado });
      bot("⚠️ Tuve una falla temporal. Ya lo dejé registrado; puedes reintentar o empezar de nuevo.", [{ label: "Empezar de nuevo", id: "reiniciar" }]);
    }
  }

  function enviarTexto() {
    const v = entrada.value.trim();
    if (!v) return;
    entrada.value = "";
    quitarChips();
    mensaje("user", v);
    procesar("texto", v);
  }
  btnEnviar.addEventListener("click", enviarTexto);
  entrada.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); enviarTexto(); } });

  /* ---------- Ficha técnica ---------- */
  function seccion(titulo, ...nodos) { const s = el("section"); s.appendChild(el("h3", "", titulo)); nodos.forEach(n => s.appendChild(n)); return s; }
  function tabla(cabecera, filas) {
    const cont = el("div", "tabla"), t = el("table"), th = el("tr");
    cabecera.forEach(c => th.appendChild(el("th", "", c))); t.appendChild(th);
    filas.forEach(f => { const tr = el("tr"); f.forEach(c => tr.appendChild(el("td", "", c))); t.appendChild(tr); });
    cont.appendChild(t); return cont;
  }
  function abrirFicha() {
    const cuerpo = document.getElementById("ficha-cuerpo");
    cuerpo.textContent = "";
    const nombres = Object.keys(D.metricas);
    cuerpo.appendChild(seccion("Qué es",
      el("p", "", "Asistente informativo que estima el nivel de riesgo (bajo, medio o alto) de delitos de mayor connotación social (DMCS) según región, día de la semana, franja horaria y época del año. Es un apoyo preventivo; no identifica ni evalúa personas.")));
    cuerpo.appendChild(seccion("Datos",
      el("p", "", "Estadísticas policiales 2025 (casos policiales: denuncias y detenciones en flagrancia de Carabineros), publicadas por el INE, en cuadros por región, mes, día y franja horaria. Población regional del Censo 2017 (INE). Feriados según el calendario de Chile.")));
    cuerpo.appendChild(seccion(`Modelo seleccionado: ${D.modelo}`,
      el("p", "", `Versión ${D.version}, generada el ${D.generado}. Se compararon tres algoritmos con validación cruzada anidada y se eligió el de mayor puntaje ponderado (error 35%, riesgo alto 30%, estabilidad 15%, interpretabilidad 10%, costo y tiempo 10%).`),
      tabla(["Modelo", "Error (MAE)", "F1 riesgo alto", "Top-k", "Puntaje"],
        nombres.map(n => [n, fmt(D.metricas[n].MAE, 0), fmt(D.metricas[n].F1_alto, 2), fmt(D.metricas[n].top_k, 2), fmt(D.puntajes[n].PUNTAJE, 2)])),
      el("p", "ctx", "Prueba temporal (entrenar con enero a junio, probar con julio a diciembre):"),
      tabla(["Modelo", "Error de participación (pp)", "Top-k", "F1 riesgo alto"],
        nombres.map(n => [n, fmt(D.temporal[n].error_particip_pp, 2), fmt(D.temporal[n].top_k, 2), fmt(D.temporal[n].F1_alto, 2)]))));
    cuerpo.appendChild(seccion("Cómo se calcula",
      el("p", "", "Para cada delito, el modelo estima qué parte de los casos cae en cada región, día, franja y mes, y la compara con lo esperable por tamaño (población, días, horas). El producto de esos factores se transforma en una tasa por habitante y se clasifica en bajo (bajo el percentil 50), medio o alto (sobre el percentil 85) respecto de todas las combinaciones posibles. La confianza sale de la incertidumbre del modelo en validación; si es menor a " + fmt(D.umbral, 2) + ", se entrega un rango.")));
    cuerpo.appendChild(seccion("Limitaciones",
      (() => { const ul = el("ul"); [
        "Los datos disponibles llegan a nivel de región, no de comuna: las comunas de la Región Metropolitana se consultan como Región Metropolitana.",
        "Los cuadros no traen combinaciones entre región, día, franja y mes, así que el modelo las trata como independientes.",
        "Solo hay un año con detalle por delito (2025). Para otras fechas se repiten los patrones de 2025.",
        "No incorpora indicadores de la ENUSC ni corrige la subdenuncia: los registros reflejan dónde se denuncia y patrulla, no solo dónde hay más delito.",
        "Las probabilidades no están calibradas formalmente.",
        "Es una estimación, no una certeza. No debe usarse para decisiones sobre personas ni para sanciones."
      ].forEach(t => ul.appendChild(el("li", "", t))); return ul; })()));
    const nfb = leerLS(LS_FB).length, ninc = leerLS(LS_INC).length;
    const borrar = el("button", "chip", "Borrar mis registros"); borrar.type = "button";
    borrar.addEventListener("click", () => { escribirLS(LS_FB, []); escribirLS(LS_INC, []); abrirFicha(); });
    cuerpo.appendChild(seccion("Privacidad y registros",
      el("p", "", `No se piden ni guardan datos personales. En este navegador hay ${nfb} registro(s) de opinión y ${ninc} incidente(s), que se eliminan solos a los ${RETENCION_DIAS} días.`), borrar));
    ficha.hidden = false;
    document.getElementById("cerrar-ficha").focus();
  }
  document.getElementById("abrir-ficha").addEventListener("click", abrirFicha);
  document.getElementById("cerrar-ficha").addEventListener("click", () => { ficha.hidden = true; entrada.focus(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !ficha.hidden) ficha.hidden = true; });
  document.getElementById("reiniciar").addEventListener("click", iniciar);

  window.__dmcs = { procesar, estado: () => S };   // para pruebas
  iniciar();
})();

</script>
